<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maryam Mojarrabi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Segoe UI', Helvetica, sans-serif;
            background: #faf7f2;
            padding: 20px;
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 24px;
            padding: 44px 32px 32px;
            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.04),
                0 20px 40px -12px rgba(180, 83, 9, 0.18);
            overflow: hidden;
        }

        /* Soft decorative glow */
        .card::after {
            content: "";
            position: absolute;
            top: -70px;
            right: -70px;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #fde68a 0%, transparent 70%);
            opacity: 0.55;
            pointer-events: none;
        }

        .monogram {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(140deg, #f59e0b, #b45309);
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 8px 20px -6px rgba(180, 83, 9, 0.5);
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1c1917;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }

        .rule {
            width: 40px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, #f59e0b, #b45309);
            margin-bottom: 28px;
        }

        .contact {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 14px 16px;
            background: #faf7f2;
            border-radius: 14px;
            border: 1px solid #f0e9dd;
            transition: all 0.2s ease;
        }

        .item:hover {
            background: #fff8ec;
            border-color: #fcd9a0;
        }

        .tag {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #b45309;
        }

        .value {
            font-size: 14px;
            font-weight: 500;
            color: #292524;
            direction: ltr;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="monogram">MM</div>
        <h1>Maryam Mojarrabi</h1>
        <div class="rule"></div>

        <div class="contact">
            <div class="item">
                <span class="tag">Phone</span>
                <span class="value">+9891*****170</span>
            </div>
            <div class="item">
                <span class="tag">Email</span>
                <span class="value">MaryamM***@gmail.com</span>
            </div>
        </div>
    </div>
</body>
</html>
